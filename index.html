<style>

.table-panel{margin-bottom:17px}.table-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--paper);font-size:12px;width:195px;color:var(--ink)}.select{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--paper);font-size:12px;color:var(--ink)}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:680px}thead th{text-align:left;font-size:10px;text-transform:none;letter-spacing:.2px;color:var(--muted);font-weight:650;background:#f8f7f1;padding:11px 17px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}tbody td{padding:12px 17px;border-bottom:1px solid #eeeDE5;font-size:11px;white-space:nowrap}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fbfaf6}.item-cell{display:flex;align-items:center;gap:10px}.item-icon{width:31px;height:31px;border-radius:9px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-size:15px;flex-shrink:0}.item-icon.out{background:var(--red-soft);color:var(--red)}.item-title{font-weight:700;font-size:11px}.item-sub{font-size:10px;color:var(--muted);margin-top:2px}.positive{color:var(--green);font-weight:700}.negative{color:var(--red);font-weight:700}.table-actions{display:flex;gap:4px}.empty{padding:34px;text-align:center;color:var(--muted);font-size:12px}

0px;padding:15px 5px 0}

.insight-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:16px;margin:0 0 17px}.insight-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin:0 0 16px}.insight-metric{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:14px;min-width:0}.insight-metric .label{font-size:11px;color:var(--muted)}.insight-metric .value{font-size:19px;line-height:1.35;font-weight:760;margin:6px 0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.insight-metric .hint{font-size:10px;color:var(--muted)}.daily-chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px;align-items:end;padding:8px 0 0}.day-col{min-width:0;text-align:center}.day-value{font-size:9px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:5px}.daybar-wrap{height:105px;display:flex;align-items:end;justify-content:center;border-bottom:1px solid var(--line);background:linear-gradient(to top,transparent 24%,rgba(120,130,120,.07) 25%,transparent 26%,transparent 49%,rgba(120,130,120,.07) 50%,transparent 51%,transparent 74%,rgba(120,130,120,.07) 75%,transparent 76%)}.daybar{width:min(27px,70%);min-height:3px;background:var(--green);border-radius:6px 6px 2px 2px}.daybar.today{background:var(--gold)}.day-label{font-size:10px;color:var(--muted);padding-top:7px;white-space:nowrap}.insight-rows{display:grid;gap:13px}.insight-row{display:grid;grid-template-columns:minmax(82px,1.05fr) minmax(40px,1.8fr) minmax(70px,.85fr);gap:9px;align-items:center;font-size:11px}.insight-name{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.insight-track{height:8px;border-radius:99px;background:#efeee7;overflow:hidden}.insight-fill{height:100%;border-radius:99px;background:var(--green)}.insight-fill.gold{background:var(--gold)}.insight-amount{text-align:right;font-weight:700;white-space:nowrap;font-size:10px}.insight-divider{border-top:1px solid var(--line);margin-top:15 /* ---- screen-fit hardening ---- */
html,body{max-width:100%;overflow-x:hidden}.shell{min-height:100vh;min-height:100dvh}.sidebar{overflow-y:auto}
.content{padding:20px 26px 32px}.topbar>div:first-child{min-width:0}.topbar h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi,.panel,.field,.insight-metric{min-width:0}.kpi .amount,.barval,.expense-val,.due-amount,.insight-amount{overflow-wrap:anywhere}
.page-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}.detail-stats{flex-wrap:wrap}
.table-wrap table{min-width:0}.table-wrap th,.table-wrap td{padding-left:8px;padding-right:8px;overflow-wrap:anywhere}
.insight-name{white-space:normal;overflow-wrap:anywhere}.insight-metric .value{white-space:normal;overflow-wrap:anywhere}.comparison-line{gap:12px}.comparison-line strong{text-align:right}
.modal{max-height:92vh;max-height:92dvh}.toast{max-width:calc(100vw - 32px)}.top-actions{flex-shrink:0}
@media(max-width:1000px){.grid-two{grid-template-columns:minmax(0,1fr)}}
@media(max-width:820px){.content{padding:14px 12px 28px}.topbar{padding:0 12px}}
@media(max-width:560px){.table-wrap{font-size:11px}.lt th:nth-child(3),.lt td:nth-child(3){display:none}.kpi .amount{font-size:clamp(16px,5.2vw,21px)}.panel-head{padding:13px 13px 9px}.panel-body{padding-left:13px;padding-right:13px}.insight-row{grid-template-columns:minmax(70px,.9fr) minmax(30px,1fr) auto}}
/* ===== Reference-style redesign ===== */
:root{--teal:#0f8a7e;--side:#0a5a55;--dred:#ef5a5a;--dgrn:#0f8a7e;--dor:#f2a62c;--dbg:#faf8f3;--dline:#ece7dc;--dink:#1d2a27;--dmut:#7b8581}
body{background:var(--dbg);color:var(--dink)}
.shell{grid-template-columns:262px minmax(0,1fr);max-width:none}
.sidebar{background:var(--side)!important;color:#fff!important;padding:22px 15px 18px!important;display:flex!important;flex-direction:column;gap:0!important;border:0!important}
@media(min-width:821px){.sidebar{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}}
.sb-brand{display:flex;gap:12px;align-items:center;padding:0 6px 26px}.sb-brand svg{width:46px;height:46px;stroke-width:1.5}.sb-brand h1{margin:0;font-size:25px;line-height:1.15;color:#fff}.sb-brand small{display:block;font-size:12.5px;color:#cfe6e1;margin-top:2px}

  const catHint = name => { const d = EXPENSE_CAT_DEFS.find(x => x[0] === name); return d && d[2] ? 'যেমন: ' + String(d[2]).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) : ''; };
  const pageNames = {overview:'সারসংক্ষেপ',transactions:'লেনদেন',cycles:'বেতন-চক্র',loans:'ঋণ নিয়েছি',receivables:'পাওনা',investments:'বিনিয়োগ',reports:'প্রতিবেদন',categories:'খরচের খাত',income:'আয়',budget:'বাজেট',settings:'সেটিংস ও যাচাই'};
  const typeNames = {salary:'বেতন',income:'অন্যান্য আয়',expense:'দৈনন্দিন খরচ',borrow:'ঋণ গ্রহণ',repay:'ঋণ পরিশোধ',lend:'ধার দিয়েছি',collect:'পাওনা আদায়',invest:'বিনিয়োগ',withdraw:'বিনিয়োগ উত্তোলন',valuation:'মূল্য সমন্বয়'};
  const typeIcons = {salary:'৳',income:'＋',expense:'−',borrow:'↙',repay:'↗',lend:'↗',collect:'↙',invest:'◇',withdraw:'↗',valuation:'≈'};
  const demo = {
    mode:'demo', openingCash:2500, budget:30000, goal:{name:'জরুরি তহবিল (ডেমো)',target:50000},
    loans:[
      {id:'L-ST',name:'বন্ধুর কাছ থেকে ধার',kind:'short',opening:0,due:'2026-11-25',installment:1500,note:'মাসিক খরচ সামলানোর সাময়িক ধার'},
      {id:'L-LT',name:'দীর্ঘমেয়াদি ঋণ',kind:'long',opening:120000,due:'2027-06-01',installment:4900,note:'আগে থেকে থাকা ঋণের বকেয়া'}
    ],
    receivables:[{id:'R-01',name:'রহিম',opening:0,due:'2026-11-15',note:'ব্যক্তিগত ধার'}],
    investments:[{id:'I-01',name:'সঞ্চয় তহবিল',kind:'সঞ্চয়',note:'মাসিক বিনিয়োগ'}],
    records:[
      {id:'T-01',date:'2026-10-25',type:'salary',amount:45000,category:'বেতন',note:'মাসিক বেতন'},
      {id:'T-02',date:'2026-10-26',type:'income',amount:1500,category:'অন্যান্য আয়',note:'অতিরিক্ত আয়'},
      {id:'T-03',date:'2026-10-26',type:'borrow',amount:8000,loanId:'L-ST',category:'ঋণ গ্রহণ',note:'সাময়িক ধার'},
      {id:'T-04',date:'2026-10-25',type:'expense',amount:12000,category:'বাসা ভাড়া',note:'মাসিক ভাড়া'},
      {id:'T-05',date:'2026-10-25',type:'expense',amount:1800,category:'বাজার/খাবার',note:'বাজার'},
      {id:'T-06',date:'2026-10-26',type:'expense',amount:600,category:'যাতায়াত',note:'যাতায়াত খরচ'},
      {id:'T-07',date:'2026-10-26',type:'expense',amount:2500,category:'বাজার/খাবার',note:'খাবার'},
      {id:'T-08',date:'2026-10-26',type:'expense',amount:800,category:'মোবাইল/ইন্টারনেট',note:'মোবাইল ও ইন্টারনেট বিল'},
      {id:'T-09',date:'2026-10-27',type:'expense',amount:1200,category:'বিল/ইউটিলিটি',note:'ইউটিলিটি বিল'},
      {id:'T-10',date:'2026-10-27',type:'repay',principal:1500,interest:100,loanId:'L-ST',amount:1600,category:'ঋণ পরিশোধ',note:'আংশিক পরিশোধ'},
      {id:'T-11',date:'2026-10-27',type:'repay',principal:4000,interest:900,loanId:'L-LT',amount:4900,category:'ঋণ পরিশোধ',note:'দীর্ঘমেয়াদি ঋণের কিস্তি'},
      {id:'T-12',date:'2026-10-26',type:'lend',amount:3000,receivableId:'R-01',category:'ধার দিয়েছি',note:'রহিমকে ধার'},
      {id:'T-13',date:'2026-10-27',type:'collect',principal:700,interest:0,amount:700,receivableId:'R-01',category:'পাওনা আদায়',note:'আংশিক টাকা ফেরত'},
      {id:'T-14',date:'2026-10-27',type:'invest',amount:4000,investmentId:'I-01',category:'বিনিয়োগ',note:'সঞ্চয় তহবিলে জমা'}
    ]
  };
  let state = loadState();
  let page = 'overview';
  let editId = null;
  const $ = id => document.getElementById(id);
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function loadState(){ try { const raw=localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : clone(demo); } catch(e){return clone(demo);} }
  function save(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) { /* Keep the current session usable when embedded previews block storage. */ } }
  function n(v){return Number(v||0)}
  function fmt(v){ const x=Math.round(n(v)); return (x<0?'−':'')+'৳'+new Intl.NumberFormat('bn-BD',{maximumFractionDigits:0}).format(Math.abs(x)); }
  function fmtNum(v){return new Intl.NumberFormat('bn-BD',{maximumFractionDigits:0}).format(Math.round(n(v)));}
  function dateFmt(iso){ if(!iso)return '—'; try{return new Date(iso+'T12:00:00').toLocaleDateString('bn-BD',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return iso;} }
  function todayISO(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Dhaka'}).format(new Date())}
  function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function total(a,fn){return a.reduce((s,x)=>s+n(fn(x)),0)}
  function recById(arr,id){return arr.find(x=>x.id===id)}
  function sortedRecords(records=state.records){return [...records].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));}
  function calc(){
    const rs=state.records.filter(r=>r.date<=todayISO());
    const salary=total(rs.filter(r=>r.type==='salary'),r=>r.amount);
    const otherIncome=total(rs.filter(r=>r.type==='income'),r=>r.amount);
    const interestIncome=total(rs.filter(r=>r.type==='collect'),r=>r.interest||0);
    const everyday=total(rs.filter(r=>r.type==='expense'),r=>r.amount);
    const interestOut=total(rs.filter(r=>r.type==='repay'),r=>r.interest||0);
    const borrowed=total(rs.filter(r=>r.type==='borrow'),r=>r.amount);
    const principalRepaid=total(rs.filter(r=>r.type==='repay'),r=>r.principal||0);
    const lent=total(rs.filter(r=>r.type==='lend'),r=>r.amount);
    const collection=total(rs.filter(r=>r.type==='collect'),r=>r.principal||0);
    const invested=total(rs.filter(r=>r.type==='invest'),r=>r.amount);
    const withdrawn=total(rs.filter(r=>r.type==='withdraw'),r=>r.amount);
    const investments=state.investments.map(it=>{
      const adds=total(rs.filter(r=>r.type==='invest'&&r.investmentId===it.id),r=>r.amount);
      const takes=total(rs.filter(r=>r.type==='withdraw'&&r.investmentId===it.id),r=>r.amount);
      const adjustment=total(rs.filter(r=>r.type==='valuation'&&r.investmentId===it.id),r=>r.delta||0);
      return {...it,contributions:adds,withdrawals:takes,currentValue:Math.max(0,adds-takes+adjustment)};
    });
    const loans=state.loans.map(l=>{
      const received=total(rs.filter(r=>r.type==='borrow'&&r.loanId===l.id),r=>r.amount);
      const paid=total(rs.filter(r=>r.type==='repay'&&r.loanId===l.id),r=>r.principal||0);
      return {...l,received,principalPaid:paid,outstanding:l.opening+received-paid};
    });
    const receivables=state.receivables.map(x=>{
      const advanced=total(rs.filter(r=>r.type==='lend'&&r.receivableId===x.id),r=>r.amount);
      const returned=total(rs.filter(r=>r.type==='collect'&&r.receivableId===x.id),r=>r.principal||0);
      return {...x,advanced,returned,outstanding:x.opening+advanced-returned};
    });
    const cash=state.openingCash+salary+otherIncome+interestIncome+borrowed+collection+withdrawn-everyday-principalRepaid-interestOut-lent-invested;
    const liabilityShort=total(loans.filter(l=>l.kind==='short'),l=>l.outstanding);
    const liabilityLong=total(loans.filter(l=>l.kind==='long'),l=>l.outstanding);
    const receivable=total(receivables,x=>x.outstanding);
    const investmentValue=total(investments,i=>i.currentValue);
    const income=salary+otherIncome+interestIncome;
    const expense=everyday+interestOut;
    const netWorth=cash+receivable+investmentValue-liabilityShort-liabilityLong;
    const salaryDates=[...new Set(rs.filter(r=>r.type==='salary').map(r=>r.date))].sort();
    const now=todayISO();
    const currentStart=[...salaryDates].reverse().find(d=>d<=now)||salaryDates[salaryDates.length-1]||null;
    const nextSalary=currentStart?salaryDates.find(d=>d>currentStart):null;
    const cycleEnd=nextSalary?shiftISO(nextSalary,-1):null;
    const cycleRecords=currentStart?rs.filter(r=>r.date>=currentStart&&(!nextSalary||r.date<nextSalary)):[];

  function budgetPage(c){const g=state.goal||{};return '<div class="d-head"><div><h1>বাজেট ও সঞ্চয়ের লক্ষ্য</h1><p>এখানে ঠিক করা অঙ্ক ড্যাশবোর্ডের কার্ডে সরাসরি দেখাবে।</p></div></div><div class="d-row3b"><section class="d-card"><div class="d-ch"><span class="d-ci">'+ic('target')+'</span><h3>মাসিক বাজেট</h3></div><label class="d-f">মোট বাজেট (৳)<input id="bTotal" type="number" min="0" step="1" value="'+(n(state.budget)||'')+'"></label><div class="d-note">খরচ = দৈনন্দিন খরচ + ঋণের সুদ/ফি। ঋণের মূল টাকা ও বিনিয়োগ বাজেটে ধরা হয় না।</div></section><section class="d-card"><div class="d-ch"><span class="d-ci">'+ic('pouch')+'</span><h3>সঞ্চয়ের লক্ষ্য</h3></div><label class="d-f">লক্ষ্যের নাম<input id="gName" type="text" maxlength="60" value="'+escapeHtml(g.name||'')+'"></label><label class="d-f">লক্ষ্যের অঙ্ক (৳)<input id="gTarget" type="number" min="0" step="1" value="'+(n(g.target)||'')+'"></label><div class="d-note">অগ্রগতি = বিনিয়োগ/সঞ্চয়ের বর্তমান মূল্য ('+fmt(c.investmentValue)+')। এটি খরচ হিসেবে ধরা হয় না।</div></section></div><button class="d-add" style="margin-top:14px" data-action="saveBudget">সংরক্ষণ করুন</button>'}
  document.addEventListener('change',e=>{const id=e.target.id;if(id==='dashCycle'){dashStart=e.target.value||null;render();const f=$('dashCycle');if(f)f.focus()}if(id==='chartDays'){chartDays=+e.target.value||7;render();const f=$('chartDays');if(f)f.focus()}});
  document.addEventListener('click',e=>{if(e.target.closest('#cycleBtn.is-off'))toast('বেতন যোগ করলে বেতন-চক্র এখানে বাছাই করা যাবে।')});
  document.addEventListener('click',e=>{
    const m=document.getElementById('rowMenu');if(m&&!e.target.closest('[data-action=rowmenu]'))m.remove();
    const a=e.target.closest('[data-action]');if(!a)return;
    if(a.dataset.action==='rowmenu'){const old=document.getElementById('rowMenu');if(old){old.remove();return}const b=a.getBoundingClientRect(),d=document.createElement('div');d.id='rowMenu';d.className='d-menu';d.style.top=(window.scrollY+b.bottom+4)+'px';d.style.left=Math.max(8,b.right-140)+'px';d.innerHTML='<button data-action="edit" data-id="'+escapeHtml(a.dataset.id)+'">সম্পাদনা</button><button class="red" data-action="delete" data-id="'+escapeHtml(a.dataset.id)+'">মুছুন</button>';document.body.appendChild(d)}
    if(a.dataset.action==='saveBudget'){const b=Number($('bTotal').value||0),t=Number($('gTarget').value||0);if(!(b>=0)||!(t>=0)){toast('সঠিক অঙ্ক দিন।');return}state.budget=Math.round(b);state.goal={name:$('gName').value.trim(),target:Math.round(t)};save();render();toast('বাজেট ও লক্ষ্য সংরক্ষিত হয়েছে।')}

  function reportInsights(c){const I=dashboardInsights(c);return '<div class="section-head" style="margin-top:18px"><div><h3>খরচের প্রবণতা ও আসন্ন তারিখ</h3><p>দৈনন্দিন খরচের তুলনা, আয়ের উৎস ও আসন্ন কিস্তি/পাওনা</p></div></div>'+I.metrics+'<div class="insight-grid">'+I.trends+I.compare+'</div><div class="insight-grid">'+I.income+I.cats+'</div><div class="insight-grid">'+I.upcoming+'</div>'}
  function buildChrome(){

  function ledgerTable(records,actions=true){return `<div class="table-wrap"><table class="lt"><thead><tr><th>তারিখ / বিবরণ</th><th>ধরন</th><th>বিভাগ</th><th>নগদ পরিবর্তন</th>${actions?'<th>ব্যবস্থা</th>':''}</tr></thead><tbody>${records.length?records.map(r=>`<tr><td><div class="item-cell"><div class="item-icon ${cashDelta(r)<0?'out':''}">${typeIcons[r.type]||'•'}</div><div><div class="item-title">${escapeHtml(r.note||r.category||typeNames[r.type])}</div><div class="item-sub">${dateFmt(r.date)}</div></div></div></td><td>${typePill(r.type)}</td><td>${escapeHtml(r.category||typeNames[r.type])}</td><td class="${cashDelta(r)>=0?'positive':'negative'}">${recordCashLabel(r)}</td>${actions?`<td><div class="table-actions"><button class="btn small" data-action="edit" data-id="${r.id}">সম্পাদনা</button><button class="btn small danger" data-action="delete" data-id="${r.id}">×</button></div></td>`:''}</tr>`).join(''):`<tr><td colspan="${actions?5:4}"><div class="empty">কোনো লেনদেন পাওয়া যায়নি। “নতুন রেকর্ড” থেকে যোগ করুন।</div></td></tr>`}</tbody></table></div>`;}
  function transactionsPage(c){return `<div class="section-head"><div><h3>সব লেনদেন</h3><p>প্রতিটি রেকর্ডের নগদ প্রভাব দেখুন, খুঁজুন ও সম্পাদনা করুন।</p></div><button class="btn primary" data-action="new">＋ নতুন রেকর্ড</button></div><section class="panel table-panel"><div class="panel-head"><div><h4>লেনদেনের খাতা</h4><p>${fmtNum(state.records.length)}টি রেকর্ড · হিসাব স্বয়ংক্রিয়ভাবে আপডেট হয়</p></div><div class="table-tools"><input class="search" id="searchTx" placeholder="বিবরণ বা বিভাগ খুঁজুন…"><select class="select" id="filterType"><option value="all">সব ধরন</option>${Object.entries(typeNames).filter(([k])=>k!=='valuation').map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><button class="btn small" data-action="csv">CSV ↓</button></div></div><div id="txTable">${ledgerTable(sortedRecords())}</div></section><div class="form-note">মনে রাখুন: বেতন-চক্র অনুযায়ী রিপোর্টে ঋণের মূল টাকা, ধার দেওয়া ও বিনিয়োগ খরচ হিসেবে দেখানো হবে না।</div>`;}
  function cyclesPage(c){const dates=c.salaryDates;const cycles=dates.map((start,i)=>{const next=dates[i+1]||null;const end=next?shiftISO(next,-1):null;const rs=state.records.filter(r=>r.date<=todayISO()&&r.date>=start&&(!next||r.date<next));const inc=total(rs.filter(r=>['salary','income'].includes(r.type)),r=>r.amount)+total(rs.filter(r=>r.type==='collect'),r=>r.interest||0);const exp=total(rs.filter(r=>r.type==='expense'),r=>r.amount)+total(rs.filter(r=>r.type==='repay'),r=>r.interest||0);return {start,end,next,rs,inc,exp,delta:cycleCash(rs),salary:total(rs.filter(r=>r.type==='salary'),r=>r.amount)}}).reverse();return `<div class="section-head"><div><h3>বেতন-চক্র</h3><p>বেতন জমা হওয়ার দিন থেকে পরের বেতন আসার আগের দিন পর্যন্ত।</p></div><button class="btn primary" data-action="new" data-type="salary">＋ বেতন যোগ করুন</button></div>${c.currentStart?`<section class="panel" style="margin-bottom:16px"><div class="panel-head"><div><h4>বর্তমান বেতন-চক্র</h4><p>${currentCycleText(c)}</p></div><span class="pill">চলমান</span></div><div class="panel-body"><div class="kpis" style="margin:0">${kpi('চক্রের আয়',fmt(c.cycleIncome),'প্রধান আয় ও সুদ','↗','blue')}${kpi('চক্রের খরচ',fmt(c.cycleExpense),'ব্যয়যোগ্য খরচ','↘','red')}${kpi('নগদ পরিবর্তন',(c.cycleCashChange>=0?'+':'')+fmt(c.cycleCashChange),'সব নগদ চলাচল','⇄')}${kpi('বেতনের পর রেকর্ড',fmtNum(c.cycleRecords.length),'এই চক্রের মোট রেকর্ড','▤','gold')}</div></div></section>`:''}<section class="panel"><div class="panel-head"><div><h4>আগের চক্রগুলোর তুলনা</h4><p>বেতন-তারিখগুলোই চক্রের সীমা নির্ধারণ করে।</p></div></div><div class="table-wrap"><table><thead><tr><th>বেতন-চক্র</th><th>বেতন</th><th>মোট আয়</th><th>মোট খরচ</th><th>নগদ পরিবর্তন</th><th>রেকর্ড</th></tr></thead><tbody>${cycles.length?cycles.map(x=>`<tr><td><strong>${dateFmt(x.start)}</strong><div class="item-sub">${x.end?`শেষ ${dateFmt(x.end)}`:'পরের বেতন এখনো যোগ হয়নি'}</div></td><td>${fmt(x.salary)}</td><td class="positive">${fmt(x.inc)}</td><td class="negative">${fmt(x.exp)}</td><td class="${x.delta>=0?'positive':'negative'}">${x.delta>=0?'+':''}${fmt(x.delta)}</td><td>${fmtNum(x.rs.length)}</td></tr>`).join(''):`<tr><td colspan="6"><div class="empty">বেতন যোগ করলে বেতন-চক্র এখানে দেখা যাবে।</div></td></tr>`}</tbody></table></div></section>`;}
  function loansPage(c){return `<div class="section-head"><div><h3>ঋণ নিয়েছি</h3><p>স্বল্পমেয়াদি ধার ও দীর্ঘমেয়াদি ঋণ আলাদা হিসাব করুন।</p></div><button class="btn primary" data-action="addLoan">＋ ঋণ যোগ করুন</button></div><div class="kpis">${kpi('মোট বকেয়া',fmt(c.liabilities),'সব ঋণ মিলিয়ে','↙','red')}${kpi('স্বল্পমেয়াদি',fmt(c.liabilityShort),'মাসিক খরচ সামলানোর ধার','◷','gold')}${kpi('দীর্ঘমেয়াদি',fmt(c.liabilityLong),'দীর্ঘ সময়ের ঋণ','▤','blue')}${kpi('এই পর্যন্ত মূল টাকা শোধ',fmt(c.principalRepaid),'বকেয়া কমেছে, খরচ নয়','↗')}</div><div class="page-grid">${c.loans.map(l=>`<article class="detail-card"><div class="detail-top"><div><h4>${escapeHtml(l.name)}</h4><div class="meta">${l.kind==='short'?'স্বল্পমেয়াদি':'দীর্ঘমেয়াদি'} · ${l.id}</div></div><span class="pill ${l.outstanding>0?'red':''}">${l.outstanding>0?'বকেয়া':'পরিশোধিত'}</span></div><div class="detail-big">${fmt(l.outstanding)}</div><div class="meta">বর্তমান বকেয়া মূল টাকা</div><div class="detail-stats"><div>আগের বকেয়া<strong>${fmt(l.opening)}</strong></div><div>মোট নতুন ধার<strong>${fmt(l.received)}</strong></div><div>মূল টাকা শোধ<strong>${fmt(l.principalPaid)}</strong></div></div><div class="detail-stats"><div>পরবর্তী তারিখ<strong>${dateFmt(l.due)}</strong></div><div>মাসিক কিস্তি<strong>${fmt(l.installment)}</strong></div></div><p class="meta">${escapeHtml(l.note||'কোনো নোট নেই')}</p><button class="btn small" data-action="repay" data-id="${l.id}" ${l.outstanding<=0?'disabled':''}>কিস্তি / পরিশোধ যোগ করুন</button></article>`).join('')||'<div class="empty">ঋণের রেকর্ড নেই।</div>'}</div><div class="form-note" style="margin-top:15px">ঋণের মূল টাকা পরিশোধ করলে বকেয়া কমে; শুধু সুদ ও ফি খরচ হিসেবে রিপোর্ট হয়। আগের থেকে থাকা ঋণ যোগ করলে হাতে নগদ বাড়বে না।</div>`;}
  function receivablesPage(c){return `<div class="section-head"><div><h3>পাওনা / ধার দিয়েছি</h3><p>কাকে কত দিয়েছ এবং কত ফেরত পেয়েছ—সব রেকর্ড রাখুন।</p></div><button class="btn primary" data-action="addReceivable">＋ পাওনা যোগ করুন</button></div><div class="kpis">${kpi('মোট পাওনা',fmt(c.receivable),'এখনো ফেরত আসেনি','↗','blue')}${kpi('মোট ধার দিয়েছি',fmt(c.lent),'নগদ কমেছে, সম্পদে পাওনা বেড়েছে','↘','gold')}${kpi('মূল টাকা ফেরত',fmt(c.collection),'আয় হিসেবে ধরা হয়নি','↙')}${kpi('সুদ পেয়েছি',fmt(c.interestIncome),'শুধুমাত্র সুদ আয়','＋','blue')}</div><div class="page-grid">${c.receivables.map(r=>`<article class="detail-card"><div class="detail-top"><div><h4>${escapeHtml(r.name)}</h4><div class="meta">${r.id}</div></div><span class="pill ${r.outstanding>0?'gold':''}">${r.outstanding>0?'ফেরত বাকি':'সম্পন্ন'}</span></div><div class="detail-big">${fmt(r.outstanding)}</div><div class="meta">বর্তমান পাওনা</div><div class="detail-stats"><div>আগের পাওনা<strong>${fmt(r.opening)}</strong></div><div>মোট ধার<strong>${fmt(r.advanced)}</strong></div><div>ফেরত পেয়েছি<strong>${fmt(r.returned)}</strong></div></div><div class="detail-stats"><div>ফেরতের তারিখ<strong>${dateFmt(r.due)}</strong></div><div>রেকর্ডের নোট<strong>${escapeHtml(r.note||'—')}</strong></div></div><button class="btn small" data-action="collect" data-id="${r.id}" ${r.outstanding<=0?'disabled':''}>ফেরত পাওয়া যোগ করুন</button></article>`).join('')||'<div class="empty">কারো কাছে পাওনা নেই।</div>'}</div><div class="form-note" style="margin-top:15px">আগের থেকে থাকা পাওনা যোগ করলে নগদ বাড়বে না। নতুন করে ধার দিলে নগদ কমবে। ফেরত পাওয়া মূল টাকা আয় নয়; শুধু সুদ আয়।</div>`;}
  function investmentsPage(c){return `<div class="section-head"><div><h3>বিনিয়োগ</h3><p>নগদ থেকে বিনিয়োগে সরানো টাকা খরচ নয়। মূল্য পরিবর্তন আলাদা সম্পদ হিসেবে দেখা হয়।</p></div><button class="btn primary" data-action="addInvestment">＋ বিনিয়োগ যোগ করুন</button></div><div class="kpis">${kpi('বর্তমান বিনিয়োগ মূল্য',fmt(c.investmentValue),'সব বিনিয়োগ মিলিয়ে','◇','gold')}${kpi('মোট জমা',fmt(c.invested),'নগদ কমেছে, সম্পদ বেড়েছে','↘','blue')}${kpi('মোট উত্তোলন',fmt(c.withdrawn),'নগদে ফিরেছে, আয় নয়','↗')}${kpi('আনুমানিক নীট সম্পদ',fmt(c.netWorth),'সব সম্পদ ও ঋণ মিলিয়ে','▤','gold')}</div><div class="page-grid">${c.investments.map(i=>`<article class="detail-card"><div class="detail-top"><div><h4>${escapeHtml(i.name)}</h4><div class="meta">${escapeHtml(i.kind||'অন্যান্য')} · ${i.id}</div></div><span class="pill">সম্পদ</span></div><div class="detail-big">${fmt(i.currentValue)}</div><div class="meta">বর্তমান হিসাবি মূল্য</div><div class="detail-stats"><div>মোট জমা<strong>${fmt(i.contributions)}</strong></div><div>মোট উত্তোলন<strong>${fmt(i.withdrawals)}</strong></div><div>মূল্য সমন্বয়<strong>${fmt(i.currentValue-i.contributions+i.withdrawals)}</strong></div></div><p class="meta">${escapeHtml(i.note||'কোনো নোট নেই')}</p><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn small" data-action="investMore" data-id="${i.id}">আরও জমা</button><button class="btn small" data-action="withdraw" data-id="${i.id}">উত্তোলন</button><button class="btn small secondary" data-action="valuation" data-id="${i.id}">বর্তমান মূল্য বদলান</button></div></article>`).join('')||'<div class="empty">বিনিয়োগের রেকর্ড নেই।</div>'}</div>`;}
  function reportsPage(c){const cashIns=totalCashByType(c.cycleRecords,['salary','income','borrow','collect','withdraw'],r=>r.type==='collect'?n(r.principal)+n(r.interest):r.amount);const cashOut=totalCashByType(c.cycleRecords,['expense','repay','lend','invest'],r=>r.type==='repay'?n(r.principal)+n(r.interest):r.amount);const max=Math.max(c.cycleIncome,c.cycleExpense,cashIns,cashOut,1);return `<div class="section-head"><div><h3>প্রতিবেদন</h3><p>নির্বাচিত বর্তমান বেতন-চক্রের হিসাবসূত্র থেকে তৈরি সারাংশ।</p></div><button class="btn" data-action="csv">CSV ডাউনলোড ↓</button></div><div class="grid-two"><section class="panel"><div class="panel-head"><div><h4>আয় বনাম খরচ</h4><p>ঋণের মূল টাকা ও বিনিয়োগ ব্যয়ের বাইরে রাখা হয়েছে</p></div></div><div class="panel-body"><div class="cash-bars">${[['আয়',c.cycleIncome,''],['খরচ',c.cycleExpense,'out']].map(([l,v,cl])=>`<div class="barrow"><span class="barlabel">${l}</span><div class="bartrack"><div class="barfill ${cl}" style="width:${Math.max(2,v/max*100)}%"></div></div><span class="barval">${fmt(v)}</span></div>`).join('')}</div><div class="chart-foot"><span class="muted">আয় − খরচ</span><strong class="${c.cycleIncome>=c.cycleExpense?'positive':'negative'}">${fmt(c.cycleIncome-c.cycleExpense)}</strong></div></div></section><section class="panel"><div class="panel-head"><div><h4>নগদ প্রবেশ বনাম বহির্গমন</h4><p>ধার ও সম্পদ স্থানান্তরসহ সব নগদ চলাচল</p></div></div><div class="panel-body"><div class="cash-bars">${[['নগদ প্রবেশ',cashIns,''],['নগদ বের হয়েছে',cashOut,'out']].map(([l,v,cl])=>`<div class="barrow"><span class="barlabel">${l}</span><div class="bartrack"><div class="barfill ${cl}" style="width:${Math.max(2,v/max*100)}%"></div></div><span class="barval">${fmt(v)}</span></div>`).join('')}</div><div class="chart-foot"><span class="muted">নগদ পরিবর্তন</span><strong>${fmt(c.cash-state.openingCash)}</strong></div></div></section></div><section class="panel table-panel"><div class="panel-head"><div><h4>সম্পদ ও দায়ের বিবরণ</h4><p>নীট সম্পদের হিসাবের উপাদান</p></div></div><div class="table-wrap"><table><thead><tr><th>উপাদান</th><th>ধরন</th><th>পরিমাণ</th></tr></thead><tbody><tr><td>হাতে নগদ</td><td><span class="pill">সম্পদ</span></td><td>${fmt(c.cash)}</td></tr><tr><td>অন্যের কাছে পাওনা</td><td><span class="pill">সম্পদ</span></td><td>${fmt(c.receivable)}</td></tr><tr><td>বিনিয়োগের বর্তমান মূল্য</td><td><span class="pill">সম্পদ</span></td><td>${fmt(c.investmentValue)}</td></tr><tr><td>স্বল্পমেয়াদি ঋণ</td><td><span class="pill red">দায়</span></td><td class="negative">−${fmt(c.liabilityShort)}</td></tr><tr><td>দীর্ঘমেয়াদি ঋণ</td><td><span class="pill red">দায়</span></td><td class="negative">−${fmt(c.liabilityLong)}</td></tr><tr><td><strong>আনুমানিক নীট সম্পদ</strong></td><td>সম্পদ − দায়</td><td><strong>${fmt(c.netWorth)}</strong></td></tr></tbody></table></div></section><div class="form-note" style="margin-top:14px">এই প্রতিবেদন বর্তমান প্রোটোটাইপের রেকর্ডের ভিত্তিতে। ব্যাংক ব্যালান্স, নগদে থাকা অন্যান্য সম্পদ বা অরেকর্ডকৃত ঋণ যোগ না করলে নীট সম্পদ অসম্পূর্ণ থাকবে।</div>`;}
  function settingsPage(c){const checks=runChecks(c);return `<div class="section-head"><div><h3>সেটিংস ও হিসাব যাচাই</h3><p>সূত্রের স্বচ্ছতা, ডেটা ব্যাকআপ ও ডেমো পরীক্ষা।</p></div></div><div class="settings-grid"><section class="panel"><div class="panel-head"><div><h4>প্রাথমিক সেটিংস</h4><p>নিজের হিসাবের ভিত্তি</p></div></div><div class="panel-body"><div class="setting-row"><div><strong>প্রারম্ভিক নগদ</strong><small>রেকর্ড শুরুর সময়কার নগদ ব্যালান্স</small></div><div style="display:flex;align-items:center;gap:8px"><strong>${fmt(state.openingCash)}</strong><button class="btn small" data-action="openingCash">পরিবর্তন</button></div></div><div class="setting-row"><div><strong>মুদ্রা</strong><small>বাংলাদেশি টাকা</small></div><strong>BDT · ৳</strong></div><div class="setting-row"><div><strong>সংরক্ষণ</strong><small>এই ব্রাউজারের localStorage</small></div><span class="pill gold">লোকাল</span></div><div class="setting-row"><div><strong>ডেমো ডেটা</strong><small>বাস্তব ব্যবহার করার আগে পরিষ্কার করুন</small></div><button class="btn small secondary" data-action="fresh">নিজের হিসাব শুরু</button></div><div class="setting-row"><div><strong>আবার ডেমো</strong><small>নমুনা রেকর্ড পুনরায় যোগ করবে</small></div><button class="btn small" data-action="resetDemo">ডেমো রিসেট</button></div><div class="setting-row"><div><strong>JSON ব্যাকআপ</strong><small>রেকর্ডের কপি ডাউনলোড করুন</small></div><button class="btn small" data-action="backup">ডাউনলোড ↓</button></div><div class="setting-row"><div><strong>JSON রিস্টোর</strong><small>আগের ব্যাকআপ ফাইল থেকে ফিরিয়ে আনুন</small></div><button class="btn small" data-action="restore">ফাইল বাছুন ↑</button></div><input id="restoreFile" type="file" accept="application/json,.json" hidden /></div></section><section class="panel"><div class="panel-head"><div><h4>হিসাব যাচাই</h4><p>ডেমো ডেটার প্রত্যাশিত ফলের সঙ্গে সূত্র মিলিয়ে দেখা</p></div><span class="pill ${checks.every(x=>x.pass)?'':'red'}">${checks.filter(x=>x.pass).length}/${checks.length} ঠিক</span></div><div class="panel-body"><div class="checklist">${checks.map(x=>`<div class="checkrow"><span class="check" style="${x.pass?'':'background:var(--red-soft);color:var(--red)'}">${x.pass?'✓':'!'}</span><div style="flex:1"><strong>${x.label}</strong><div class="muted" style="margin-top:2px">প্রত্যাশিত ${fmt(x.expected)} · গণনা ${fmt(x.actual)}</div></div></div>`).join('')}</div><div class="form-note" style="margin-top:14px">${state.mode==='demo'?'ডেমো যাচাই: মূলধনের লেনদেন আয়/খরচে ভুলভাবে যোগ হচ্ছে কি না পরীক্ষা করা হচ্ছে.':'ডেমো যাচাই বন্ধ আছে, কারণ আপনি নিজের খাতা শুরু করেছেন। হিসাবের মূল সূত্র এখনও একইভাবে প্রয়োগ হচ্ছে।'}</div></div></section></div><section class="panel" style="margin-top:16px"><div class="panel-head"><div><h4>ডেটা ও গোপনীয়তা</h4><p>প্রোটোটাইপের সীমাবদ্ধতা</p></div></div><div class="panel-body"><p style="font-size:12px;margin:0 0 9px">এই প্রোটোটাইপে তথ্য শুধু এই ব্রাউজারে থাকে; ব্রাউজার/ডিভাইস বদলালে আগে Backup নিন।</p><p class="muted" style="font-size:11px;margin:0">এটি এখনো কোনো লাইভ ডেটাবেস, লগইন, ব্যাংক অ্যাকাউন্ট বা স্বয়ংক্রিয় নোটিফিকেশনের সঙ্গে যুক্ত নয়। লাইভ করার আগে ডেটাবেস, প্রমাণীকরণ, নিরাপত্তা, ব্যাকআপ ও আরও পরীক্ষা যোগ করা উচিত।</p></div></section>`;}
  function runChecks(c){if(state.mode!=='demo')return [];const expect=[['হাতে নগদ',25300,c.cash],['চক্রের আয়',46500,c.cycleIncome],['চক্রের খরচ',19900,c.cycleExpense],['স্বল্পমেয়াদি ঋণ বকেয়া',6500,c.liabilityShort],['দীর্ঘমেয়াদি ঋণ বকেয়া',116000,c.liabilityLong],['মোট ঋণ বকেয়া',122500,c.liabilities],['অন্যের কাছে পাওনা',2300,c.receivable],['বিনিয়োগের বর্তমান মূল্য',4000,c.investmentValue],['নীট সম্পদ',-90900,c.netWorth],['প্রারম্ভিক নগদ বাদে নগদ পরিবর্তন',22800,c.cash-state.openingCash]];return expect.map(([label,expected,actual])=>({label,expected,actual,pass:Math.round(actual)===expected}));}
  function openModal(type='expense',record=null,defaults={}){editId=record?.id||null;$('modalTitle').textContent=record?'রেকর্ড সম্পাদনা':type==='repay'?'ঋণ পরিশোধ':type==='collect'?'পাওনা ফেরত':type==='salary'?'বেতন যোগ করুন':'নতুন রেকর্ড';$('modalSub').textContent=record?'পরিবর্তন করলে সব হিসাব নতুন করে গণনা হবে':'রেকর্ডের ধরন অনুযায়ী তথ্য দিন';type=record?.type||defaults.type||type;$('formFields').innerHTML=formFor(type,record,defaults);$('formError').style.display='none';$('modalBackdrop').classList.add('show');$('formFields').dataset.type=type; if(record){$('formFields').dataset.editId=record.id;}else delete $('formFields').dataset.editId; }
  function opt(values,selected){return values.map(x=>`<option value="${escapeHtml(x[0])}" ${x[0]===selected?'selected':''}>${escapeHtml(x[1])}</option>`).join('');}
  function field(label,name,value,type='text',extra='',full=false,help=''){return `<div class="field ${full?'full':''}"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${escapeHtml(value??'')}" ${extra}>${help?`<small>${help}</small>`:''}</div>`;}

  function formFor(type,r={},defaults={}){const date=r.date||defaults.date||todayISO();let out=selectField('রেকর্ডের ধরন','type',Object.entries(typeNames).filter(([k])=>k!=='valuation').map(([k,v])=>[k,v]),type,true,'ঋণ ও বিনিয়োগের মূল টাকা আয় বা খরচ হিসেবে গণনা হয় না।');out+=field('তারিখ','date',date,'date','required');

  function loanOutstanding(id,excludeId=null){const l=recById(state.loans,id);if(!l)return 0;return l.opening+total(state.records.filter(x=>x.loanId===id&&x.id!==excludeId&&x.type==='borrow'),x=>x.amount)-total(state.records.filter(x=>x.loanId===id&&x.id!==excludeId&&x.type==='repay'),x=>x.principal||0);}
  function receivableOutstanding(id,excludeId=null){const l=recById(state.receivables,id);if(!l)return 0;return l.opening+total(state.records.filter(x=>x.receivableId===id&&x.id!==excludeId&&x.type==='lend'),x=>x.amount)-total(state.records.filter(x=>x.receivableId===id&&x.id!==excludeId&&x.type==='collect'),x=>x.principal||0);}

  function saveRecord(e){e.preventDefault();const wasEditing=Boolean(editId);const fd=new FormData($('recordForm'));const get=k=>String(fd.get(k)||'').trim();const type=get('type'),date=get('date'),note=get('note'),amount=n(get('amount')),principal=n(get('principal')),interest=n(get('interest'));if(!date||Number.isNaN(Date.parse(date))){showError('সঠিক তারিখ দিন।');return;}if(['salary','income','expense','borrow','lend','invest','withdraw'].includes(type)&&amount<=0){showError('টাকার পরিমাণ শূন্যের বেশি হতে হবে।');return;}if(['repay','collect'].includes(type)&&(principal<0||interest<0||principal+interest<=0)){showError('মূল টাকা বা সুদ/ফি-এর অন্তত একটি পরিমাণ দিতে হবে।');return;}let r={id:editId||genId(),date,type,note};
    if(['salary','income','expense'].includes(type)){r.amount=amount;r.category=get('category')||typeNames[type];}

    if(type==='repay'){r.principal=principal;r.interest=interest;r.amount=principal+interest;r.loanId=get('loanId');r.category=typeNames[type];if(principal>loanOutstanding(r.loanId,editId)){showError(`মূল টাকা শোধ বকেয়ার চেয়ে বেশি। সর্বোচ্চ ${fmt(loanOutstanding(r.loanId,editId))} দিতে পারবেন।`);return;}if(!recById(state.loans,r.loanId)){showError('ঋণ নির্বাচন করুন।');return;}}
    if(type==='lend'){r.amount=amount;r.receivableId=get('receivableId');r.category=typeNames[type];if(!recById(state.receivables,r.receivableId)){showError('ব্যক্তি/পাওনা নির্বাচন করুন।');return;}}
    if(type==='collect'){r.principal=principal;r.interest=interest;r.amount=principal+interest;r.receivableId=get('receivableId');r.category=typeNames[type];if(principal>receivableOutstanding(r.receivableId,editId)){showError(`ফেরত নেওয়া মূল টাকা পাওনার চেয়ে বেশি। সর্বোচ্চ ${fmt(receivableOutstanding(r.receivableId,editId))} নিতে পারবেন।`);return;}if(!recById(state.receivables,r.receivableId)){showError('পাওনা নির্বাচন করুন।');return;}}
    if(type==='invest'||type==='withdraw'){r.amount=amount;r.investmentId=get('investmentId');r.category=typeNames[type];if(!recById(state.investments,r.investmentId)){showError('বিনিয়োগ নির্বাচন করুন।');return;}if(type==='withdraw'&&amount>calc().investments.find(x=>x.id===r.investmentId)?.currentValue){showError('উত্তোলন বর্তমান বিনিয়োগ মূল্যের চেয়ে বেশি হতে পারবে না।');return;}}
    if(editId){const i=state.records.findIndex(x=>x.id===editId);state.records[i]=r;}else state.records.push(r);state.mode='custom';save();closeModal();render();toast(wasEditing?'রেকর্ড আপডেট হয়েছে':'নতুন রেকর্ড যোগ হয়েছে');}
  function addLoan(){const name=prompt('ঋণদাতা বা ঋণের নাম লিখুন:');if(!name?.trim())return;const kind=confirm('এটি কি দীর্ঘমেয়াদি ঋণ?\nOK = দীর্ঘমেয়াদি, Cancel = স্বল্পমেয়াদি');const openingText=prompt('আগের থেকে থাকা বকেয়া (৳) লিখুন। নতুন ধার এখন পেলে 0 দিন:','0');if(openingText===null)return;const opening=n(openingText);if(opening<0||!Number.isFinite(opening)){toast('বকেয়ার পরিমাণ সঠিক নয়');return;}const due=prompt('পরবর্তী কিস্তি/পরিশোধের তারিখ (YYYY-MM-DD), না থাকলে ফাঁকা রাখুন:','');const installment=n(prompt('মাসিক কিস্তি (৳), না থাকলে 0:','0'));state.loans.push({id:genId('L'),name:name.trim(),kind:kind?'long':'short',opening,due:due||'',installment,note:'নিজে যোগ করা ঋণ'});state.mode='custom';save();render();toast('ঋণের রেকর্ড যোগ হয়েছে।');if(opening>0)toast('আগের বকেয়া যোগ হয়েছে; নগদ ব্যালান্স বদলায়নি।');}

  function addInvestment(){const name=prompt('বিনিয়োগের নাম:');if(!name?.trim())return;const kind=prompt('ধরন (যেমন সঞ্চয়, সোনা, ব্যবসা, শেয়ার):','সঞ্চয়')||'অন্যান্য';const note=prompt('নোট (ঐচ্ছিক):','')||'';state.investments.push({id:genId('I'),name:name.trim(),kind,note});state.mode='custom';save();render();toast('বিনিয়োগের খাতা তৈরি হয়েছে। এখন “আরও জমা” থেকে টাকা যোগ করুন।');}
  function addValuation(id){const inv=recById(state.investments,id);if(!inv)return;const current=calc().investments.find(x=>x.id===id)?.currentValue||0;const valueText=prompt(`“${inv.name}” এর নতুন বর্তমান মূল্য লিখুন (৳):`,String(current));if(valueText===null)return;const value=n(valueText);if(value<0||!Number.isFinite(value)){toast('সঠিক মূল্য দিন।');return;}const delta=value-current;if(delta===0){toast('মূল্য পরিবর্তন হয়নি।');return;}state.records.push({id:genId(),date:todayISO(),type:'valuation',delta,amount:delta,investmentId:id,category:'মূল্য সমন্বয়',note:`বর্তমান মূল্য ${fmt(current)} থেকে ${fmt(value)}`});state.mode='custom';save();render();toast('বিনিয়োগের মূল্য বদলেছে; নগদ বদলায়নি।');}

  function validateLinkedBalances(records = state.records, loans = state.loans, receivables = state.receivables) {
    for (const loan of loans) {
      let balance = n(loan.opening);
      const events = records.filter(r => r.loanId === loan.id && ['borrow','repay'].includes(r.type)).sort((a,b) => a.date.localeCompare(b.date) || (a.type === b.type ? String(a.id).localeCompare(String(b.id)) : a.type === 'borrow' ? -1 : 1));
      for (const r of events) {
        if (r.type === 'borrow') balance += n(r.amount);
        else {
          const principal = n(r.principal);
          if (principal > balance) return `${loan.name}: ${dateFmt(r.date)} তারিখের ঋণ পরিশোধ তখনকার বকেয়ার চেয়ে বেশি।`;
          balance -= principal;
        }
      }
    }
    for (const item of receivables) {
      let balance = n(item.opening);
      const events = records.filter(r => r.receivableId === item.id && ['lend','collect'].includes(r.type)).sort((a,b) => a.date.localeCompare(b.date) || (a.type === b.type ? String(a.id).localeCompare(String(b.id)) : a.type === 'lend' ? -1 : 1));
      for (const r of events) {
        if (r.type === 'lend') balance += n(r.amount);
        else {
          const principal = n(r.principal);
          if (principal > balance) return `${item.name}: ${dateFmt(r.date)} তারিখে ফেরত নেওয়া মূল টাকা তখনকার পাওনার চেয়ে বেশি।`;
          balance -= principal;
        }
      }
    }
    for (const item of state.investments) {
      const added = total(records.filter(r => r.type === 'invest' && r.investmentId === item.id), r => r.amount);
      const taken = total(records.filter(r => r.type === 'withdraw' && r.investmentId === item.id), r => r.amount);
      const adjustment = total(records.filter(r => r.type === 'valuation' && r.investmentId === item.id), r => r.delta || 0);
      if (added - taken + adjustment < 0) return `${item.name}: উত্তোলন বা মূল্য সমন্বয়ের পর বিনিয়োগের মূল্য ঋণাত্মক হতে পারবে না।`;
    }
    return '';
  }

  function saveEntityForm(type, fd) {
    const get = key => String(fd.get(key) ?? '').trim();
    const amount = key => get(key) === '' ? 0 : Number(get(key));
    const validAmount = value => Number.isInteger(value) && Number.isFinite(value) && value >= 0;
    const name = get('name');
    if (!name) { showError('নাম লিখুন।'); return; }
    const editing = entityEditing && entityEditing.type === type ? entityEditing : null;
    const date = get('date') || todayISO();
    let target, collection, message;
    if (type === 'loanSetup') {
      const opening = amount('opening'), received = editing ? 0 : amount('received'), installment = amount('installment');
      if (![opening,received,installment].every(validAmount)) { showError('সব টাকার অঙ্ক পূর্ণ টাকা ও শূন্য বা তার বেশি হতে হবে।'); return; }
      if (!editing && opening === 0 && received === 0) { showError('আগের বকেয়া বা এখন পাওয়া নতুন টাকার অন্তত একটি অঙ্ক দিন।'); return; }
      if (received > 0 && Number.isNaN(Date.parse(date))) { showError('টাকা পাওয়ার সঠিক তারিখ দিন।'); return; }
      collection = state.loans;
      const old = editing ? recById(collection, editing.id) : null;
      target = { ...(old || {}), id: old?.id || genId('L'), name, kind: get('kind') === 'long' ? 'long' : 'short', opening, due: get('due'), installment, note: get('note') };
      message = editing ? 'ঋণের তথ্য আপডেট হয়েছে।' : 'ঋণের খাতা তৈরি হয়েছে।';
      if (editing) {
        const before = collection.slice(); collection[collection.findIndex(x => x.id === old.id)] = target;
        const issue = validateLinkedBalances(state.records, collection, state.receivables);
        if (issue) { state.loans = before; showError(issue); return; }
      } else {
        state.loans.push(target);
        if (received > 0) state.records.push({ id: genId(), date, type: 'borrow', amount: received, loanId: target.id, category: typeNames.borrow, note: `নতুন ঋণ গ্রহণ: ${name}` });
      }
    } else if (type === 'receivableSetup') {
      const opening = amount('opening'), lentNow = editing ? 0 : amount('lentNow');
      if (![opening,lentNow].every(validAmount)) { showError('সব টাকার অঙ্ক পূর্ণ টাকা ও শূন্য বা তার বেশি হতে হবে।'); return; }
      if (!editing && opening === 0 && lentNow === 0) { showError('আগের পাওনা বা এখন ধার দেওয়া টাকার অন্তত একটি অঙ্ক দিন।'); return; }
      if (lentNow > 0 && Number.isNaN(Date.parse(date))) { showError('ধার দেওয়ার সঠিক তারিখ দিন।'); return; }
      collection = state.receivables;
      const old = editing ? recById(collection, editing.id) : null;
      target = { ...(old || {}), id: old?.id || genId('R'), name, opening, due: get('due'), note: get('note') };
      message = editing ? 'পাওনার তথ্য আপডেট হয়েছে।' : 'পাওনার খাতা তৈরি হয়েছে।';
      if (editing) {
        const before = collection.slice(); collection[collection.findIndex(x => x.id === old.id)] = target;
        const issue = validateLinkedBalances(state.records, state.loans, collection);
        if (issue) { state.receivables = before; showError(issue); return; }
      } else {
        state.receivables.push(target);
        if (lentNow > 0) state.records.push({ id: genId(), date, type: 'lend', amount: lentNow, receivableId: target.id, category: typeNames.lend, note: `ধার দেওয়া হয়েছে: ${name}` });
      }
    } else {
      const contribution = editing ? 0 : amount('contribution');
      if (!validAmount(contribution)) { showError('প্রাথমিক জমা পূর্ণ টাকা ও শূন্য বা তার বেশি হতে হবে।'); return; }
      if (contribution > 0 && Number.isNaN(Date.parse(date))) { showError('জমার সঠিক তারিখ দিন।'); return; }
      collection = state.investments;
      const old = editing ? recById(collection, editing.id) : null;
      target = { ...(old || {}), id: old?.id || genId('I'), name, kind: get('kind') || 'অন্যান্য', note: get('note') };
      message = editing ? 'বিনিয়োগের তথ্য আপডেট হয়েছে।' : 'বিনিয়োগের খাতা তৈরি হয়েছে।';
      if (editing) collection[collection.findIndex(x => x.id === old.id)] = target;
      else {
        state.investments.push(target);
        if (contribution > 0) state.records.push({ id: genId(), date, type: 'invest', amount: contribution, investmentId: target.id, category: typeNames.invest, note: `প্রাথমিক বিনিয়োগ: ${name}` });
      }
    }
    const issue = validateLinkedBalances(state.records, state.loans, state.receivables);
    if (issue) { showError(issue); return; }
    state.mode = 'custom'; save(); entityEditing = null; closeModal(); render(); toast(message);
  }

  const standardSaveRecord = saveRecord;
  saveRecord = function(e) {
    const fd = new FormData($('recordForm'));
    const type = String(fd.get('type') || $('formFields').dataset.type || 'expense');
    if (['loanSetup','receivableSetup','investmentSetup'].includes(type)) { e.preventDefault(); saveEntityForm(type, fd); return; }
    for (const key of ['amount','principal','interest']) {
      if (fd.has(key) && String(fd.get(key) ?? '').trim() !== '') {
        const value = Number(fd.get(key));
        if (!Number.isInteger(value) || !Number.isFinite(value) || value < 0) { e.preventDefault(); showError('টাকার অঙ্ক পূর্ণ সংখ্যা হতে হবে; ঋণাত্মক অঙ্ক দেওয়া যাবে না।'); return; }
      }
    }
    const before = clone(state), previousEdit = editId;
    standardSaveRecord(e);
    if (!$('modalBackdrop').classList.contains('show')) {
      const issue = validateLinkedBalances(state.records, state.loans, state.receivables);
      if (issue) {
        state = before; save(); render();
        const old = previousEdit ? recById(state.records, previousEdit) : null;
        openModal(old?.type || type, old || null);
        showError(`${issue} এই পরিবর্তনটি বাতিল করা হয়েছে।`);
        toast('হিসাবের অসঙ্গতি পাওয়া গেছে');
      }
    }
  };

  const standardDeleteRecord = delRecord;
  delRecord = function(id) {
    const record = recById(state.records, id);
    if (!record || !confirm(`“${record.note || typeNames[record.type]}” রেকর্ডটি মুছে ফেলবেন? সম্পর্কিত হিসাব আবার গণনা হবে।`)) return;

    state.records = next; state.mode = 'custom'; save(); render(); toast('রেকর্ড মুছে ফেলা হয়েছে।');
  };

  function removeEntity(type, id) {
    const config = {
      loan: { list: state.loans, key: 'loanId', label: 'ঋণ', name: 'ঋণের খাতা' },
      receivable: { list: state.receivables, key: 'receivableId', label: 'পাওনা', name: 'পাওনার খাতা' },
      investment: { list: state.investments, key: 'investmentId', label: 'বিনিয়োগ', name: 'বিনিয়োগের খাতা' }
    }[type];
    if (!config) return;
    if (state.records.some(r => r[config.key] === id)) { toast('এই খাতার সঙ্গে লেনদেন যুক্ত আছে। হিসাবের ইতিহাস অক্ষত রাখতে আগে লেনদেনগুলো পর্যালোচনা করুন।'); return; }
    const item = recById(config.list, id);
    if (!item || !confirm(`“${item.name}” ${config.name} মুছে ফেলবেন?`)) return;
    const next = config.list.filter(x => x.id !== id);
    if (type === 'loan') state.loans = next;
    if (type === 'receivable') state.receivables = next;
    if (type === 'investment') state.investments = next;
    state.mode = 'custom'; save(); render(); toast(`${config.name} মুছে ফেলা হয়েছে।`);
  }

  function applyTransactionFilters() {
    const table = $('txTable'); if (!table) return;
    const search = ($('searchTx')?.value || '').toLowerCase();
    const type = $('filterType')?.value || 'all';
    const category = $('filterCategory')?.value || 'all';
    const from = $('filterFrom')?.value || '', to = $('filterTo')?.value || '';
    const records = sortedRecords().filter(r => (type === 'all' || r.type === type) && (category === 'all' || (r.category || typeNames[r.type]) === category) && (!from || r.date >= from) && (!to || r.date <= to) && [r.note,r.category,typeNames[r.type]].join(' ').toLowerCase().includes(search));
    table.innerHTML = ledgerTable(records);
  }

  const standardReportsPage = reportsPage;
  reportsPage = function(c) {
    const records = reportRange.from || reportRange.to ? state.records.filter(r => r.date <= todayISO() && (!reportRange.from || r.date >= reportRange.from) && (!reportRange.to || r.date <= reportRange.to)) : c.cycleRecords;
    const income = total(records.filter(r => ['salary','income'].includes(r.type)), r => r.amount) + total(records.filter(r => r.type === 'collect'), r => r.interest || 0);
    const expense = total(records.filter(r => r.type === 'expense'), r => r.amount) + total(records.filter(r => r.type === 'repay'), r => r.interest || 0);
    const cashChange = cycleCash(records);
    const summary = { ...c, cycleRecords: records, cycleIncome: income, cycleExpense: expense, cycleCashChange: cashChange };
    let html = standardReportsPage(summary);
    const controls = `<section class="panel" style="margin-bottom:16px"><div class="panel-head"><div><h4>তারিখ অনুযায়ী রিপোর্ট</h4><p>তারিখ ফাঁকা রাখলে বর্তমান বেতন-চক্র দেখাবে।</p></div></div><div class="panel-body" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><label class="muted" for="reportFrom">শুরু</label><input class="select" id="reportFrom" type="date" value="${escapeHtml(reportRange.from)}"><label class="muted" for="reportTo">শেষ</label><input class="select" id="reportTo" type="date" value="${escapeHtml(reportRange.to)}"><button class="btn primary" data-action="applyReportRange">প্রয়োগ</button><button class="btn" data-action="clearReportRange">বর্তমান বেতন-চক্র</button></div></section>`;
    html = controls + html.replace('নির্বাচিত বর্তমান বেতন-চক্রের হিসাবসূত্র থেকে তৈরি সারাংশ।', reportRange.from || reportRange.to ? `${reportRange.from ? dateFmt(reportRange.from) : 'শুরু থেকে'} – ${reportRange.to ? dateFmt(reportRange.to) : 'সর্বশেষ রেকর্ড'} তারিখের হিসাব।` : 'বর্তমান বেতন-চক্রের হিসাবসূত্র থেকে তৈরি সারাংশ।');
    html = html.replace(`<span class="muted">নগদ পরিবর্তন</span><strong>${fmt(c.cash-state.openingCash)}</strong>`, `<span class="muted">নগদ পরিবর্তন</span><strong>${fmt(cashChange)}</strong>`);
    return html;
  };

  const standardSave = save;
  save = function() {
    standardSave();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); storageWarning = false; }
    catch (e) { storageWarning = true; }
  };
  const standardRender = render;
  render = function() {
    standardRender();
    const old = document.getElementById('storageRestrictionNotice');
    if (old) old.remove();
    if (storageWarning) {
      const notice = document.createElement('div'); notice.id = 'storageRestrictionNotice'; notice.className = 'form-note';
      notice.style.cssText = 'margin:0 0 14px;border-color:#d5a35a;background:#fff7e8;color:#77551e';
      notice.textContent = 'এই প্রিভিউতে ব্রাউজার স্টোরেজ বন্ধ। বর্তমান সেশন ব্যবহার করা যাবে, কিন্তু পাতা বন্ধ বা রিফ্রেশের আগে JSON ব্যাকআপ ডাউনলোড করুন।';
      $('content').prepend(notice);
    }
    const oldU = document.getElementById('unknownRecordsNotice'); if (oldU) oldU.remove();
    const unknown = state.records.filter(r => !typeNames[r.type]);
    if (unknown.length) {
      const nb = document.createElement('div'); nb.id = 'unknownRecordsNotice'; nb.className = 'form-note';
      nb.style.cssText = 'margin:0 0 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap';
      nb.innerHTML = '<span>' + fmtNum(unknown.length) + 'টি অচেনা রেকর্ড আছে (আগের সংস্করণে ঋণ/পাওনা/বিনিয়োগ ফর্ম সংরক্ষণের ত্রুটিতে তৈরি হতে পারে)। এগুলো কোনো টাকার হিসাবে ধরা হয় না।</span><button class="btn small danger" data-action="purgeUnknown">অচেনা রেকর্ড মুছুন</button>';
      $('content').prepend(nb);
    }
  };

  document.addEventListener('input', e => { if (['searchTx','filterType','filterCategory','filterFrom','filterTo'].includes(e.target.id)) applyTransactionFilters(); });
  document.addEventListener('change', e => { if (['searchTx','filterType','filterCategory','filterFrom','filterTo'].includes(e.target.id)) applyTransactionFilters(); });
  document.addEventListener('click', e => {
    const button = e.target.closest('[data-action]'); if (!button) return;
    const action = button.dataset.action, id = button.dataset.id;
    if (action === 'editLoan') { const item = recById(state.loans,id); if (item) openModal('loanSetup',item); }
    if (action === 'editReceivable') { const item = recById(state.receivables,id); if (item) openModal('receivableSetup',item); }
    if (action === 'editInvestment') { const item = recById(state.investments,id); if (item) openModal('investmentSetup',item); }
    if (action === 'deleteLoan') removeEntity('loan',id);
    if (action === 'deleteReceivable') removeEntity('receivable',id);
    if (action === 'deleteInvestment') removeEntity('investment',id);
    if (action === 'applyReportRange') {
      const from = $('reportFrom')?.value || '', to = $('reportTo')?.value || '';
      if (from && to && from > to) { toast('শুরুর তারিখ শেষ তারিখের পরে হতে পারবে না।'); return; }
      reportRange = { from, to }; page = 'reports'; render();
    }
    if (action === 'clearReportRange') { reportRange = { from: '', to: '' }; page = 'reports'; render(); }
    if (action === 'purgeUnknown') {
      const bad = state.records.filter(r => !typeNames[r.type]); if (!bad.length) return;
      if (!confirm(fmtNum(bad.length) + 'টি অচেনা রেকর্ড মুছে ফেলবেন? এগুলো কোনো হিসাবে ধরা হয় না; আপনার অন্য কোনো রেকর্ড বদলাবে না।')) return;
      state.records = state.records.filter(r => typeNames[r.type]); save(); render(); toast('অচেনা রেকর্ড মুছে ফেলা হয়েছে।');
    }
  });

  // Expose a lightweight calculation snapshot for transparent manual inspection in developer tools.
  window.KherolipiAudit = () => {const c=calc();return {cash:c.cash,income:c.income,expense:c.expense,cycleIncome:c.cycleIncome,cycleExpense:c.cycleExpense,shortLiability:c.liabilityShort,longLiability:c.liabilityLong,receivable:c.receivable,investments:c.investmentValue,netWorth:c.netWorth,checks:runChecks(c)};};
  save();render();
})();
</script>

<script>
(() => {
  const $=id=>document.getElementById(id), root=$('ahLogin');
  const T={en:{tag:'Plan · Track · Grow',h1a:'Better Money Habits',h1b:'Brighter Future',lead:'Track your income, expenses and savings all in one place. Make smarter decisions today for a secure tomorrow.',incT:'Income Tracking',expT:'Expense Management',savT:'Savings Goal',anaT:'Smart Analytics',quote:'“Good financial habits today, a secure tomorrow.”',welcome:'Welcome Back 👋',sub:'Log in to your account and continue your financial journey.',wNew:'Create your account',sNew:'Start your own ledger in a minute.',name:'Full name',user:'Email or Username',pass:'Password',rem:'Remember me',forgot:'Forgot password?',in:'Sign In',up:'Create Account',or:'or',goog:'Continue with Google',ms:'Continue with Microsoft',safe1:'Your data is safe and secure',safe2:'We never share your information with anyone.',noAcc:"No account yet?",haveAcc:'Already have an account?',su:'Sign up',si:'Sign in',eEmpty:'Please enter your email/username and password.',eBad:'Incorrect email/username or password.',eExist:'An account with this email/username already exists.',eShort:'Password must be at least 6 characters.',eName:'Please enter your name.',soc:'needs a server/OAuth setup, so it is not active in this local version.',fgt:'Password reset needs a server. For now, create a new account or restore your backup.',out:'Log out'},
  bn:{tag:'পরিকল্পনা · হিসাব · উন্নতি',h1a:'ভালো আর্থিক অভ্যাসে',h1b:'উজ্জ্বল ভবিষ্যৎ',lead:'আপনার আয়, ব্যয়, সঞ্চয় — সবকিছু এখন এক জায়গায়!',incT:'আয় ট্র্যাকিং',expT:'ব্যয় ব্যবস্থাপনা',savT:'সঞ্চয় লক্ষ্য',anaT:'স্মার্ট বিশ্লেষণ',quote:'“আজকের সঠিক হিসাব, আগামী দিনের নিশ্চিন্ততা।”',welcome:'আবার স্বাগতম 👋',sub:'আপনার অ্যাকাউন্টে লগইন করে আর্থিক যাত্রা চালিয়ে যান।',wNew:'নতুন অ্যাকাউন্ট খুলুন',sNew:'এক মিনিটেই নিজের খাতা শুরু করুন।',name:'পুরো নাম',user:'ইমেইল বা ইউজারনেম',pass:'পাসওয়ার্ড',rem:'আমাকে মনে রাখুন',forgot:'পাসওয়ার্ড ভুলে গেছেন?',in:'সাইন ইন',up:'অ্যাকাউন্ট খুলুন',or:'অথবা',goog:'গুগল দিয়ে চালিয়ে যান',ms:'মাইক্রোসফট দিয়ে চালিয়ে যান',safe1:'আপনার তথ্য নিরাপদ',safe2:'আমরা আপনার তথ্য কারও সাথে শেয়ার করি না।',noAcc:'অ্যাকাউন্ট নেই?',haveAcc:'আগেই অ্যাকাউন্ট আছে?',su:'নতুন খুলুন',si:'সাইন ইন',eEmpty:'ইমেইল/ইউজারনেম ও পাসওয়ার্ড দিন।',eBad:'ইমেইল/ইউজারনেম বা পাসওয়ার্ড ভুল।',eExist:'এই ইমেইল/ইউজারনেমে অ্যাকাউন্ট আগেই আছে।',eShort:'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।',eName:'আপনার নাম লিখুন।',soc:'চালু করতে সার্ভার/OAuth সেটআপ লাগবে; এই লোকাল ভার্সনে সক্রিয় নয়।',fgt:'পাসওয়ার্ড রিসেটের জন্য সার্ভার লাগে। আপাতত নতুন অ্যাকাউন্ট খুলুন বা ব্যাকআপ রিস্টোর করুন।',out:'লগআউট'}};
  let lang='en',mode='in';
  try{lang=localStorage.getItem('ah-lang')||'en'}catch(e){}
  const AK='ah-accounts-v1',SK='ah-session-v1';
  const rd=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
  const sess=()=>{try{return sessionStorage.getItem(SK)||localStorage.getItem(SK)}catch(e){return null}};
  async function hash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ah:'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'x:'+btoa(unescape(encodeURIComponent(p)))}}
  function paint(){
    const t=T[lang];document.documentElement.lang=lang==='bn'?'bn':'en';
    root.querySelectorAll('[data-t]').forEach(e=>e.textContent=t[e.dataset.t]);
    root.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
    const up=mode==='up';
    $('ahTitle').textContent=up?t.wNew:t.welcome;$('ahSub').textContent=up?t.sNew:t.sub;
    $('ahGoT').textContent=up?t.up:t.in;$('ahSwQ').textContent=up?t.haveAcc:t.noAcc;$('ahSw').textContent=up?t.si:t.su;
    $('ahNameF').hidden=!up;$('ahForgot').style.visibility=up?'hidden':'visible';
    $('ahPass').autocomplete=up?'new-password':'current-password';
    const o=document.getElementById('ahOut');if(o)o.textContent='⎋ '+t.out;
  }
  const err=m=>{const e=$('ahErr');e.textContent=m||'';e.classList.toggle('on',!!m)};
  function enter(name){
    root.classList.add('hide');
    const sb=document.querySelector('.sidebar-bottom'),nm=name||'';
    if(sb&&!document.getElementById('ahOut')){const b=document.createElement('button');b.id='ahOut';b.className='ahl-out';b.onclick=()=>{try{sessionStorage.removeItem(SK);localStorage.removeItem(SK)}catch(e){}$('ahPass').value='';root.classList.remove('hide');paint()};sb.appendChild(b)}
    paint();
  }
  async function submit(){
    const t=T[lang],u=$('ahUser').value.trim().toLowerCase(),p=$('ahPass').value,n=$('ahName').value.trim();
    err('');if(!u||!p)return err(t.eEmpty);
    let acc=rd(AK)||{};
    if(mode==='up'){
      if(!n)return err(t.eName);if(p.length<6)return err(t.eShort);if(acc[u])return err(t.eExist);
      acc[u]={name:n,h:await hash(p)};try{localStorage.setItem(AK,JSON.stringify(acc))}catch(e){}
    }else{
      const a=acc[u];if(!a||a.h!==await hash(p))return err(t.eBad);
    }
    try{(($('ahRem').checked?localStorage:sessionStorage)).setItem(SK,u)}catch(e){}
    enter(acc[u].name);
  }
  $('ahGo').onclick=submit;
  root.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
  $('ahSw').onclick=()=>{mode=mode==='in'?'up':'in';err('');paint()};
  $('ahEye').onclick=()=>{const p=$('ahPass'),show=p.type==='password';p.type=show?'text':'password';$('ahSlash').style.display=show?'none':''};
  $('ahForgot').onclick=()=>err(T[lang].fgt);
  root.querySelectorAll('[data-soc]').forEach(b=>b.onclick=()=>err(b.dataset.soc+' '+T[lang].soc));
  root.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem('ah-lang',lang)}catch(e){}paint()});
  paint();
  if(sess())setTimeout(()=>enter(),0);
})();
</script>
